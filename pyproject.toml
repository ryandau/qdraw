[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qdraw"
version = "2.0.0"
description = "Random draws from IBM quantum processor measurements, debiased and audited"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.3",
    "qiskit-ibm-runtime>=0.34",
]

[project.optional-dependencies]
dev = ["pytest", "qiskit-aer"]

[project.scripts]
qdraw = "qdraw.cli:main"

[tool.setuptools]
packages = ["qdraw"]
